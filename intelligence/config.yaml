# ===========================================
# aRSSe Intelligence Layer Configuration
# ===========================================
# Reihenfolge: Defaults < diese Datei < Umgebungsvariablen (.env).
# Leere Umgebungsvariablen werden ignoriert.
# Zahlen ohne Anführungszeichen angeben. Ungültige Werte verhindern den Start;
# die Meldung im Log nennt die betroffene Einstellung.

# Miniflux-Verbindung
miniflux:
  # Interne URL (Docker-Netzwerk)
  url: "http://miniflux:8080"
  # URL, unter der dein Browser Miniflux erreicht (für Links in Top Stories).
  # Wird von MINIFLUX_PUBLIC_URL bzw. BASE_URL überschrieben.
  public_url: "http://localhost:8080"
  # Port von Miniflux auf dem Server (MINIFLUX_PORT). Zeigt public_url auf
  # localhost, bauen die Top Stories ihre Links aus der aufgerufenen Adresse
  # und diesem Port – localhost wäre auf dem E-Ink-Reader das Gerät selbst.
  public_port: 8080

# Clustering-Konfiguration (Average Linkage)
clustering:
  # Maximale durchschnittliche Kosinus-Distanz der Artikel einer Story.
  # Niedriger = kleinere, schärfere Stories; höher = mehr Artikel in Stories,
  # aber ab ca. 0.8 landen unverwandte Themen zusammen.
  # 0.75 ist an ~500 echten, handmarkierten Artikeln aus 13 deutschen
  # Nachrichtenfeeds kalibriert (docs/ARCHITECTURE.md, „Messungen“).
  threshold: 0.75

  # Mindest-Ähnlichkeit (Kosinus, 0-1) einer Story aus nur zwei Artikeln.
  # Für zwei Artikel verlangt threshold nur 0.25 – das erreicht schon ein
  # einziges gemeinsames seltenes Wort („Razzia“). Am Referenzsatz entfernt
  # 0.30 von 57 Zwei-Artikel-Stories 9 der 17 unsinnigen, 7 der 14 nur
  # themenverwandten und 3 der 26 echten; 0.35 entfernt 14 unsinnige und
  # 5 echte. 0 = aus.
  # Umgebungsvariable: CLUSTERING_MIN_PAIR_SIMILARITY
  min_pair_similarity: 0.30

  # Längste Wortfolge im Vokabular: 1 = einzelne Wörter. Wortpaare (2)
  # machten Precision und Recall am Referenzsatz schlechter.
  # Umgebungsvariable: CLUSTERING_NGRAM_MAX
  ngram_max: 1

  # Maximale Features für TF-IDF Vektorisierung
  max_features: 5000

  # Sprache für Stopwords und Stemming (NLTK-Name, z.B. "german", "english")
  language: "german"

  # Wortstämme bilden ("Bundeskanzlers" -> "bundeskanzl")
  stemming: true

  # Titel, die keine Schlagzeile sein sollen, solange die Story einen
  # anderen Artikel hat: Werbung, Paywall-Anrisse, Podcasts, Liveblogs,
  # Videos, Wetter, Tagesüberblicke. Reguläre Ausdrücke, Groß-/Kleinschreibung
  # egal, ^ = Titelanfang. Die Artikel bleiben in der Story. [] = aus.
  noise_title_patterns:
    - '^(Anzeige|heise-Angebot):'
    - '^\((g|S)\+\)'
    - 'heise\+'
    - 'SPIEGEL\+'
    - '\bF\+'
    - 'SZ Plus'
    - 'Podcasts?\b'
    - 'Live-?blog|Live-?ticker|Newsblog'
    - '^Video:'
    - '^Wetter\b'
    - 'News des Tages'
    - '^Was jetzt\?'
    - 'Briefing'

# Deduplizierung
# Duplikate sind (1) derselbe Artikel doppelt geliefert (gleiche URL, gleicher
# Titel, gleicher oder fast gleicher Text ab threshold; auch aus verschiedenen
# Feeds) oder (2) Artikel verschiedener Feeds mit fast gleichem Text. Der Titel
# zählt beim Textvergleich nicht mit, und innerhalb eines Feeds gibt es sonst
# keine Duplikate (Sendungen wie „tagesschau“ tragen täglich denselben Titel).
deduplication:
  # Schwellenwert für Duplikat-Erkennung (0.0-1.0), verglichen wird der Text
  # ohne Titel. Höhere Werte = nur sehr ähnliche Artikel werden als Duplikate erkannt
  threshold: 0.85

  # Mindestlänge des Textes (Wörter ohne Titel), damit Artikel verschiedener
  # Feeds überhaupt verglichen werden (gilt nicht für Fall 1). Kurze
  # Anrisstexte wie „[ mehr ]“ sagen nichts über den Artikel.
  min_body_tokens: 25

  # Strategie zur Auswahl des "besten" Artikels (auch Schlagzeile der Story)
  # Optionen: "longest", "source_priority", "newest"
  canonical_strategy: "longest"

  # Quellen-Priorisierung für "source_priority" (höher = besser, Standard 50)
  source_scores:
    "sueddeutsche.de": 100
    "zeit.de": 95
    "spiegel.de": 90
    "faz.net": 90
    "tagesschau.de": 85
    "heise.de": 80
    "golem.de": 75

  # Aktion für Duplikate
  #   "mark_read": Duplikate in Miniflux als gelesen markieren
  #   "none":      nur in Top Stories als Duplikat kennzeichnen
  # Jedes Duplikat wird nur einmal markiert: Wer es in Miniflux wieder auf
  # ungelesen setzt, behält es ungelesen.
  duplicate_action: "mark_read"

  # Wo "mark_read" greift
  #   "visible": nur in Stories, die die Startseite zeigt (web.min_sources),
  #              doppelt gelieferte Artikel (Fall 1) überall
  #   "all":     in allen Stories
  mark_read_scope: "visible"

# Scheduling
scheduling:
  # Intervall zwischen Clustering-Läufen (Minuten)
  interval_minutes: 30

  # Artikel pro API-Anfrage (1-1000, mehr lehnt Miniflux ab)
  batch_size: 250

  # Maximale Anzahl Artikel pro Durchlauf (1-5000; Rechenzeit und Speicher
  # wachsen quadratisch). Wird die Grenze erreicht, fehlen die ältesten Artikel.
  max_entries: 2000

  # Zeitfenster für Artikel-Analyse (Stunden, mindestens 1)
  lookback_hours: 24

# Lokale Story-Datenbank (SQLite)
storage:
  db_path: "/app/data/arsse.db"
  # Artikel, die älter sind, und Stories, die so lange nicht mehr
  # aufgetaucht sind, werden gelöscht
  # (mindestens 1 und mindestens so lang wie lookback_hours)
  retention_days: 7

# Top-Stories-Weboberfläche
web:
  # Der Port ist fest 8081 im Container; extern über INTELLIGENCE_PORT in .env
  # Maximale Anzahl angezeigter Stories
  max_stories: 50
  # Weitere Artikel pro Story auf der Startseite (0 = nur die Schlagzeile)
  articles_per_story: 6
  # Nur Stories aus mindestens so vielen Feeds anzeigen
  # (blendet Werbeblöcke und Serien eines einzelnen Feeds aus).
  # Gezählt werden nur Artikel aus dem Zeitfenster (lookback_hours).
  min_sources: 2
  # Ältere Artikel einer Story (vor dem Zeitfenster), die ihre Seite unter
  # „Frühere Berichte“ zusätzlich auflistet (0 = keine)
  earlier_articles_max: 20
  # Stories nicht anzeigen, deren Artikel (im Zeitfenster) alle einen dieser
  # Titel haben – reguläre Ausdrücke wie bei noise_title_patterns.
  # Standard: der Wetterbericht, den mehrere Sender bringen. [] = alle zeigen
  exclude_patterns:
    - '^Wetter\b'
  # Nur Anfragen an diese Hostnamen beantworten (Schutz vor DNS-Rebinding),
  # z.B. ["tower.local", "192.168.1.10"]. localhost und 127.0.0.1 gehen
  # immer. Keine Platzhalter (*.example.com). Leer = jeder Hostname
  # (WEB_ALLOWED_HOSTS, kommagetrennt)
  allowed_hosts: []

  # Zugriffsschutz (README, Abschnitt "Absicherung"). /healthz bleibt offen.
  auth:
    # "none":  offen für alle, die den Port erreichen (beim Start: Warnung)
    # "basic": Anmeldung mit username/password (HTTP Basic Auth)
    # "proxy": Ein Reverse Proxy (z.B. Authelia) meldet an und übergibt den
    #          Benutzer in proxy_header
    # Umgebungsvariable: WEB_AUTH_MODE
    mode: "none"
    # Für "basic"; besser über WEB_USERNAME und WEB_PASSWORD bzw.
    # WEB_PASSWORD_FILE in .env als hier im Klartext
    username: ""
    password: ""
    password_file: ""
    # Für "proxy": Header mit dem Benutzernamen (WEB_AUTH_PROXY_HEADER, nur
    # Buchstaben, Ziffern und "-") und die Adressen des Proxys
    # (WEB_TRUSTED_PROXIES), z.B. ["172.18.0.5/32"]; 0.0.0.0/0 wird
    # abgelehnt. Von allen anderen Adressen wird die Anfrage abgelehnt.
    proxy_header: "Remote-User"
    trusted_proxies: []

# Logging
logging:
  # Log-Level: DEBUG, INFO, WARNING, ERROR
  level: "INFO"

  # JSON-Format für strukturierte Logs
  json_format: false

  # Zusätzliche Log-Datei (leer = nur stdout), z.B. "/app/data/intelligence.log"
  file: ""
