# Eigene Anpassungen (Ports, Limits, zusätzliche Mounts) gehören in eine
# docker-compose.override.yml neben dieser Datei: Compose liest sie
# automatisch, und 'git pull' lässt sie in Ruhe (README, "Konfiguration").

# Container-Logs begrenzen (Docker behält sonst alles): 3 x 10 MB je Dienst
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================
  # Miniflux - RSS Aggregator (Ingestion Layer)
  # ============================================
  miniflux:
    image: miniflux/miniflux:2.3.3
    container_name: arsse-miniflux
    logging: *default-logging
    # Miniflux schreibt nur in die Datenbank und braucht keine Rechte
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${MINIFLUX_PORT:-8080}:8080"
    environment:
      # Datenbank-Verbindung
      - DATABASE_URL=postgres://${POSTGRES_USER:-miniflux}:${POSTGRES_PASSWORD}@db/miniflux?sslmode=disable

      # Automatische Migrationen und Admin-Erstellung
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}

      # Polling-Konfiguration (Google-News-ähnliches Verhalten)
      - POLLING_FREQUENCY=${POLLING_FREQUENCY:-15}
      - POLLING_SCHEDULER=entry_frequency
      - BATCH_SIZE=100
      - WORKER_POOL_SIZE=5

      # Content-Verarbeitung
      - FETCH_YOUTUBE_WATCH_TIME=1
      - FETCH_ODYSEE_WATCH_TIME=1

      # Cleanup-Konfiguration (Freshness-Fokus)
      - CLEANUP_FREQUENCY_HOURS=1
      - CLEANUP_ARCHIVE_READ_DAYS=${CLEANUP_READ_DAYS:-60}
      - CLEANUP_ARCHIVE_UNREAD_DAYS=${CLEANUP_UNREAD_DAYS:-30}
      - CLEANUP_REMOVE_SESSIONS_DAYS=30

      # Proxy-Unterstützung für externen Zugriff
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      # Adresse(n) des Reverse Proxys (CIDR): Nur von dort wird
      # X-Forwarded-Proto geglaubt, erst dann setzt Miniflux Cookies mit
      # "Secure". Leer lehnt Miniflux ab, daher 127.0.0.1/32 (= kein Proxy)
      - TRUSTED_REVERSE_PROXY_NETWORKS=${TRUSTED_PROXIES:-127.0.0.1/32}

      # Prometheus-Metriken unter /metrics (Standard: aus). Hinter einem
      # Reverse Proxy nur mit METRICS_USERNAME/METRICS_PASSWORD einschalten:
      # Alle Anfragen über den Proxy kommen aus einem 172er-Netz
      - METRICS_COLLECTOR=${METRICS_COLLECTOR:-0}
      - METRICS_ALLOWED_NETWORKS=${METRICS_ALLOWED_NETWORKS:-172.16.0.0/12}
      - METRICS_USERNAME=${METRICS_USERNAME:-}
      - METRICS_PASSWORD=${METRICS_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - arsse-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # PostgreSQL - Datenspeicher (Storage Layer)
  # ============================================
  db:
    # Hauptversion nur mit Dump und Restore wechseln (README, "Backup und
    # Updates"): Die Datendateien einer anderen Version startet Postgres nicht
    image: postgres:${POSTGRES_MAJOR:-15}-alpine
    container_name: arsse-db
    logging: *default-logging
    # Der Entrypoint von Postgres braucht root, um die Rechte seines
    # Datenverzeichnisses zu setzen; neue Rechte gibt es trotzdem keine
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-miniflux}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=miniflux
    volumes:
      # Ab Postgres 18: POSTGRES_MOUNT=/var/lib/postgresql
      - ${DATA_PATH:-./data}/postgresql:${POSTGRES_MOUNT:-/var/lib/postgresql/data}
    networks:
      - arsse-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miniflux} -d miniflux"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # Intelligence Layer - Python Clustering Bot
  # ============================================
  intelligence:
    # Veröffentlichtes Image (amd64 und arm64): 'docker compose pull'
    # aktualisiert es. Gibt es das Image (noch) nicht, baut Compose es einmal
    # aus ./intelligence und verwendet es danach weiter; 'docker compose up -d
    # --build' baut immer den lokalen Code (so auch Updates ohne Release).
    image: ghcr.io/zwaetschge/arsse-intelligence:${ARSSE_VERSION:-latest}
    build:
      context: ./intelligence
      dockerfile: Dockerfile
    container_name: arsse-intelligence
    logging: *default-logging
    # Gemessen: ~270 MB bei 2000 Artikeln (scheduling.max_entries), ~790 MB
    # beim Höchstwert 5000; anpassen per docker-compose.override.yml
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    # Nur /app/data (und /tmp im Speicher) ist beschreibbar. Der Entrypoint
    # braucht als root CHOWN und DAC_OVERRIDE, um das Datenverzeichnis an
    # PUID:PGID zu übergeben, und SETUID/SETGID, um danach als PUID:PGID
    # zu laufen; dabei fallen alle Berechtigungen weg.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    ports:
      # Nur lokal erreichbar (hinter einem Reverse Proxy):
      # INTELLIGENCE_PORT=127.0.0.1:8081
      - "${INTELLIGENCE_PORT:-8081}:8081"
    environment:
      - MINIFLUX_URL=http://miniflux:8080
      - MINIFLUX_API_KEY=${MINIFLUX_API_KEY}
      # Alternativ Pfad zu einer Datei mit dem Key (Docker Secret)
      - MINIFLUX_API_KEY_FILE=${MINIFLUX_API_KEY_FILE:-}
      - MINIFLUX_PUBLIC_URL=${BASE_URL:-}
      # Für Links, falls BASE_URL auf localhost zeigt
      - MINIFLUX_PORT=${MINIFLUX_PORT:-8080}
      # Leer = Wert aus DATA_PATH/intelligence/config.yaml bzw. dem Standard
      - CLUSTERING_INTERVAL=${CLUSTERING_INTERVAL:-}
      - LOOKBACK_HOURS=${LOOKBACK_HOURS:-}
      - RETENTION_DAYS=${RETENTION_DAYS:-}
      - CLUSTERING_THRESHOLD=${CLUSTERING_THRESHOLD:-}
      - CLUSTERING_MIN_PAIR_SIMILARITY=${CLUSTERING_MIN_PAIR_SIMILARITY:-}
      - CLUSTERING_NGRAM_MAX=${CLUSTERING_NGRAM_MAX:-}
      - CLUSTERING_TOPIC_THRESHOLD=${CLUSTERING_TOPIC_THRESHOLD:-}
      - DEDUP_THRESHOLD=${DEDUP_THRESHOLD:-}
      - DEDUP_ACTION=${DEDUP_ACTION:-}
      - DEDUP_MIN_BODY_TOKENS=${DEDUP_MIN_BODY_TOKENS:-}
      - LOG_LEVEL=${LOG_LEVEL:-}
      # Zugriffsschutz der Top Stories (leer = config.yaml, Standard "none")
      - WEB_AUTH_MODE=${WEB_AUTH_MODE:-}
      - WEB_USERNAME=${WEB_USERNAME:-}
      - WEB_PASSWORD=${WEB_PASSWORD:-}
      - WEB_PASSWORD_FILE=${WEB_PASSWORD_FILE:-}
      - WEB_AUTH_PROXY_HEADER=${WEB_AUTH_PROXY_HEADER:-}
      - WEB_TRUSTED_PROXIES=${WEB_TRUSTED_PROXIES:-}
      - WEB_ALLOWED_HOSTS=${WEB_ALLOWED_HOSTS:-}
      - WEB_PAGE_SIZE=${WEB_PAGE_SIZE:-}
      - WEB_MIN_SOURCES=${WEB_MIN_SOURCES:-}
      - WEB_MAX_STORIES=${WEB_MAX_STORIES:-}
      - TZ=${TZ:-Europe/Berlin}
      # Der Container startet als root, übergibt ${DATA_PATH}/intelligence an
      # PUID:PGID (Unraid: 99:100) und läuft danach ohne Root-Rechte
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      # Story-Datenbank und eigene Einstellungen (config.yaml, beim ersten
      # Start angelegt); die Referenz /app/config.yaml steckt im Image
      - ${DATA_PATH:-./data}/intelligence:/app/data
      # Nur für den Umstieg: Ältere Versionen lasen ./intelligence/config.yaml.
      # Dort geänderte Einstellungen gelten weiter, das Log nennt sie mit den
      # Schritten zum Umzug nach ${DATA_PATH}/intelligence/config.yaml
      # (README, "Updates"). Fehlt ./intelligence, legt Docker es leer an.
      - ./intelligence:/app/legacy:ro
    depends_on:
      miniflux:
        condition: service_healthy
    networks:
      - arsse-network
    restart: unless-stopped

networks:
  arsse-network:
    driver: bridge
    name: arsse-network
