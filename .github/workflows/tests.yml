name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  intelligence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: intelligence/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -c "import nltk, sys; sys.exit(0 if nltk.download('stopwords') else 1)"
      - run: pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: cp .env.example .env && docker compose config --quiet
      - name: Build intelligence image
        run: docker build intelligence
      - name: Check shell scripts
        run: shellcheck scripts/*.sh

  integration:
    # Full stack against a real Miniflux: API usage, permissions, health check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/integration-test.sh
