name: Release

# Publishes ghcr.io/zwaetschge/arsse-intelligence for linux/amd64 and
# linux/arm64 once all tests pass:
#   push to the default branch   :edge and :sha-<short>
#   tag vX.Y.Z                   :X.Y.Z, :X.Y, :latest and :sha-<short>
# Pushes to other branches skip both jobs; pull requests never publish.
on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: >-
      github.event_name == 'push' && (
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    if: >-
      github.event_name == 'push' && (
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # arm64 (e.g. Raspberry Pi) is built under emulation; every dependency
      # is a wheel, so nothing is compiled
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/zwaetschge/arsse-intelligence
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=${{ github.event.repository.default_branch }}
            type=sha
          # :latest only for release tags (vX.Y.Z without a suffix)
          flavor: |
            latest=auto
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: intelligence
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
